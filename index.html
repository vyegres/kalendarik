<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Календарик">
<meta name="theme-color" content="#5EC4FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<title>Календарик</title>
<style>
:root{
  --ink:#1F2D44; --muted:#5B6B85; --card:#fff; --gold:#FFC93C; --ok:#34C759; --road:#4A5468;
  --r:28px; --gap:clamp(8px,1.8vmin,20px);
  --shadow:0 7px 0 rgba(25,45,90,.16),0 14px 26px rgba(25,45,90,.12);
  --shadow-press:0 2px 0 rgba(25,45,90,.16),0 6px 12px rgba(25,45,90,.12);
  font-family:ui-rounded,"Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{position:fixed;inset:0;color:var(--ink);background:#5EC4FF;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

/* ---------- background ---------- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(#5EC4FF,#D2F1FF 80%)}
.cl{position:absolute;left:-180px;width:150px;height:46px;border-radius:46px;background:#fff;opacity:.85;animation:drift linear infinite}
.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cl::before{width:64px;height:64px;left:24px;top:-30px}
.cl::after{width:46px;height:46px;left:76px;top:-20px}
.c1{top:9%;animation-duration:80s;animation-delay:-25s}
.c2{top:24%;animation-duration:110s;animation-delay:-70s;opacity:.7}
.c3{top:5%;animation-duration:95s;animation-delay:-55s;opacity:.6}
@keyframes drift{to{transform:translateX(calc(100vw + 360px))}}
.hill{position:absolute;border-radius:50%}
.h1{left:-20%;width:80%;height:40vh;bottom:-25vh;background:#86D873}
.h2{right:-25%;width:90%;height:46vh;bottom:-31vh;background:#6FCB5E}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* ---------- layout ---------- */
#app{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.screen{flex:1;display:flex;flex-direction:column;gap:var(--gap);min-height:0;animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.toy{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .1s ease,box-shadow .1s ease}
.toy:active{transform:translateY(5px);box-shadow:var(--shadow-press)}
.bar{display:flex;align-items:center;gap:var(--gap);flex:none}
.round{width:clamp(56px,9vmin,76px);height:clamp(56px,9vmin,76px);border-radius:50%;display:grid;place-items:center;font-size:clamp(26px,4.4vmin,38px);flex:none}
.round.ghost{visibility:hidden}
.round.xl{width:clamp(76px,13vmin,110px);height:clamp(76px,13vmin,110px);font-size:clamp(36px,6.5vmin,56px)}
.title{flex:1;text-align:center;font-weight:900;font-size:clamp(26px,4.6vmin,46px);color:#fff;text-shadow:0 3px 0 #2E86C9,0 0 14px rgba(20,90,170,.55)}
.carsvg{display:block;width:100%;height:auto;overflow:visible}
.dpill{display:inline-block;padding:.08em .55em .12em;border-radius:999px;background:var(--c);color:var(--t,#fff);font-weight:900;font-size:clamp(22px,4vmin,40px);white-space:nowrap}
.dpill.big{font-size:clamp(38px,8vmin,88px)}
.scene{width:100%;aspect-ratio:200/130;border-radius:20px;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}

/* ---------- start ---------- */
.start{align-items:center;justify-content:center;gap:5vmin}
.logo{font-weight:900;font-size:clamp(34px,7vmin,72px);color:#fff;text-shadow:0 4px 0 #2E86C9,0 0 16px rgba(20,90,170,.5)}
.logo.big{font-size:clamp(48px,11vmin,120px)}
.start-cars{display:grid;grid-template-columns:repeat(7,1fr);gap:1.4vw;width:min(92vw,1000px);background:var(--road);padding:1.4vw 1.4vw .8vw;border-radius:20px}
.start-cars>div{animation:drivefar .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d)}
@keyframes drivefar{from{transform:translateX(-110vw)}}
.gobtn{font-size:clamp(32px,6.5vmin,64px);font-weight:900;padding:2.2vmin 7vmin;background:#FF6B3D;color:#fff;border-radius:999px}

/* ---------- home ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between;gap:var(--gap)}
.pill{background:#fff;border-radius:999px;padding:8px 18px;font-size:clamp(20px,3.4vmin,32px);font-weight:900;box-shadow:var(--shadow);min-width:110px;text-align:center}
.gear{width:56px;height:56px;border-radius:50%;font-size:28px;opacity:.5;display:grid;place-items:center;background:rgba(255,255,255,.35);touch-action:none}
.gear.holding{animation:hold 1.5s linear forwards;opacity:1}
@keyframes hold{to{transform:scale(1.5) rotate(360deg);background:#fff}}
.home-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(var(--gap)*1.4);min-height:0}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:clamp(10px,2vmin,22px);min-height:0;overflow:hidden;position:relative}
.tile .art{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.tile .art>svg{height:100%;max-width:100%}
.tile .label{font-weight:900;font-size:clamp(22px,4vmin,40px)}
.t-days .art{flex-wrap:wrap;align-content:center;gap:6% 3%;padding:0 4%}
.t-days .art>div{width:21%}
.t-days::after{content:'';position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#E53935 0 14.3%,#FB8C00 0 28.6%,#FDD835 0 42.9%,#43A047 0 57.1%,#29B6F6 0 71.4%,#3949AB 0 85.7%,#8E24AA 0)}
.t-today{background:#fff;background:color-mix(in srgb,var(--c) 16%,white)}
.t-today .art{flex-direction:column;gap:10px}
.t-today .tcar{width:min(55%,240px)}
.t-stickers{background:#FFF7DA}
.t-stickers .art{gap:2vmin}
.trophy{font-size:clamp(64px,14vmin,140px);line-height:1}
.cnt{font-size:clamp(34px,7vmin,70px);font-weight:900;color:#E0A100}

/* ---------- menus ---------- */
.modes{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:calc(var(--gap)*1.5);min-height:0}
.mode{width:clamp(160px,31vmin,280px);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--bg,#fff)}
.mode .ic{font-size:clamp(56px,11vmin,110px);line-height:1.1}
.mode .t{font-weight:800;font-size:clamp(16px,2.6vmin,26px);color:var(--muted)}

/* ---------- wheel ---------- */
.wheel{width:100%;height:100%;display:block;overflow:visible}
.sector{transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-origin:0 0;cursor:pointer}
.sector.sel{transform:scale(1.08)}
.sector.next{animation:secglow 1s ease-in-out infinite}
@keyframes secglow{50%{fill:#FFF0B3}}
.wheel text{pointer-events:none}
.ringcar{transition:transform 1s cubic-bezier(.45,0,.3,1);transform-origin:0 0}

/* ---------- seasons learn / order ---------- */
.slearn,.sord{flex:1;display:flex;align-items:center;justify-content:center;gap:4vmin;min-height:0}
.wheelbox{width:min(44vw,68vh);aspect-ratio:1;flex:none}
.scard{position:relative;width:min(44vw,66vh);padding:clamp(10px,1.6vmin,18px);display:flex;flex-direction:column;align-items:center;gap:1.6vmin}
.badge{position:absolute;z-index:2;top:22px;left:22px;background:#fff;border-radius:999px;padding:4px 14px;font-weight:900;font-size:clamp(16px,2.4vmin,24px);box-shadow:var(--shadow)}
.spool{display:flex;flex-direction:column;gap:2.4vmin}
.spool .opt{width:min(30vw,calc((100vh - 220px) / 3 * 1.54))}
@media (orientation:portrait){
  .slearn,.sord{flex-direction:column}
  .wheelbox{width:min(70vw,40vh)}
  .scard{width:min(84vw,46vh)}
  .spool{flex-direction:row}
  .spool .opt{width:min(28vw,30vh)}
}

/* ---------- days learn ---------- */
.week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);column-gap:1.3vw;align-content:center;min-height:0;padding:0 .7vw}
.zone{grid-row:1/6;border-radius:24px;margin:-10px -.65vw}
.zone.school{grid-column:1/6;background:rgba(255,255,255,.78)}
.zone.home{grid-column:6/8;background:rgba(255,240,190,.92)}
.road{grid-column:1/-1;grid-row:3;align-self:end;height:30%;margin:0 -.65vw;background:var(--road);position:relative}
.road::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 34px);opacity:.75}
.daycol{display:contents}
.daycol>*{grid-column:var(--col);text-align:center;cursor:pointer}
.dflag{grid-row:1;font-size:min(3.6vw,36px);min-height:1.3em;padding-top:6px}
.dacts{grid-row:2;font-size:min(3.6vw,40px);line-height:1.3}
.dcar{grid-row:3;display:block;padding:8px 4% 5%;position:relative}
.dname{grid-row:4;font-weight:900;font-size:min(1.9vw,24px);padding-top:10px;white-space:nowrap}
.dname b{font-weight:900;text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:4px;text-underline-offset:4px}
.ddots{grid-row:5;display:flex;justify-content:center;flex-wrap:wrap;gap:3px;padding:8px 4px 14px}
.ddots i{width:min(1.2vw,12px);height:min(1.2vw,12px);border-radius:50%;background:var(--c)}
.zlabel{grid-row:6;justify-self:center;margin-top:22px;padding:4px 18px;border-radius:999px;background:rgba(255,255,255,.9);box-shadow:var(--shadow);font-weight:900;font-size:min(2.6vw,28px)}
.zlabel.school{grid-column:1/6}
.zlabel.home{grid-column:6/8}

/* ---------- quiz ---------- */
.bricks{flex:1;display:flex;justify-content:center;gap:clamp(4px,1vmin,10px)}
.brick{width:clamp(36px,6.5vmin,60px);height:auto;display:block}
.brick.on{animation:pop .45s}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.bubble{background:#fff;border-radius:44px;padding:2.5vmin 5vmin;font-size:clamp(34px,7vmin,76px);font-weight:900;box-shadow:var(--shadow);display:flex;align-items:center;gap:2vmin}
.options{display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,2.4vmin,26px);flex:none;padding-bottom:1vmin}
.opt{padding:clamp(8px,1.4vmin,14px);width:min(calc((100vw - 140px) / var(--n,3)),var(--maxw,300px));display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.opt .scene{border-radius:16px}
.opt .carbox{width:100%;padding:6% 4% 2%}
.opt .lbl{font-weight:900;font-size:clamp(18px,3vmin,30px);min-height:1.3em;visibility:hidden;white-space:nowrap}
.opt.right{box-shadow:0 0 0 6px var(--ok),var(--shadow);animation:bounce .6s}
.opt.right .lbl{visibility:visible}
.opt.off{opacity:.35;filter:grayscale(.7);pointer-events:none}
.opt.hint{animation:hint .9s ease-in-out infinite}
.opt.gone{visibility:hidden}
.opt:not(.gone) .lbl.on{visibility:visible}
.lbl b,.cap b{font-weight:900;text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:4px;text-underline-offset:4px}
.cap{margin:.8vmin auto 0;width:max-content;max-width:100%;background:#fff;border-radius:999px;padding:.15em .55em;font-weight:900;font-size:min(1.55vw,19px);color:var(--ink);white-space:nowrap}
.cap.hid{visibility:hidden}
.tm .cap{font-size:clamp(18px,3vmin,28px)}
.options.week{background:var(--road);border-radius:20px;padding:1.2vmin 1vw;gap:.8vw}
.options.week .opt{width:calc((100vw - 160px) / 7)}
.options.week .lbl{font-size:clamp(12px,1.7vw,20px)}
.row7{display:grid;grid-template-columns:repeat(var(--k,7),1fr);gap:1.2vw;width:min(100%,calc(var(--k,7) * 15vw));align-items:end;background:var(--road);padding:1.4vw 1.4vw .8vw;border-radius:20px}
.r7.filled .carsvg{animation:drivein .5s ease-out}
.r7.gh .carsvg,.tm.ask .carsvg{animation:hint 1s ease-in-out infinite}
.tmr{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(88vw,900px)}
.tmcells{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;width:100%;background:var(--road);border-radius:22px;padding:3.6vmin 3vw 1.4vmin}
.tm{position:relative}
.tm.faded{opacity:.15}
.tm.filled .carsvg{animation:drivein .5s ease-out}
.tm .pin{position:absolute;top:-.9em;left:50%;transform:translateX(-50%);font-size:clamp(28px,5vmin,48px)}
.tmlabels{display:grid;grid-template-columns:repeat(3,1fr);width:100%;text-align:center;font-weight:900;font-size:clamp(20px,3.6vmin,36px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}

/* ---------- order ---------- */
.ord{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vmin;min-height:0}
.ord-road{display:flex;align-items:center;gap:1vw;background:var(--road);border-radius:22px;padding:1.4vw}
.fin{font-size:min(4.4vw,48px)}
.slots,.snames,.pool{display:grid;grid-template-columns:repeat(7,1fr);gap:1vw}
.slots{flex:1}
.slot{aspect-ratio:120/72;border:3px dashed rgba(255,255,255,.55);border-radius:14px;display:grid;place-items:center;padding:4%}
.slot.next{border-color:var(--gold);border-style:solid;animation:glow 1.1s ease-in-out infinite}
.slot.full{border-color:transparent}
.slot.full .carsvg{animation:drivein .5s ease-out}
.slot.hint{animation:hint .9s ease-in-out infinite}
.ordq{display:flex;justify-content:center}
.snames{padding-left:calc(min(4.4vw,48px) + 2.4vw);margin-bottom:3vmin}
.sname{text-align:center;font-weight:900;font-size:min(1.8vw,22px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);min-height:1.4em;white-space:nowrap}
.pool .opt{width:auto;padding:8% 6% 6%}
.pool .opt .lbl{display:none}
.pool .opt .lbl.on{display:block;font-size:min(1.6vw,19px)}

/* ---------- today ---------- */
.today{flex:1;display:flex;gap:3vmin;min-height:0}
.tmain{flex:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vmin;padding:2vmin;background:#fff;background:color-mix(in srgb,var(--c) 14%,white)}
.tlabel{font-size:clamp(26px,5vmin,52px);font-weight:900;color:var(--muted)}
.tcarbig{width:min(62%,380px)}
.tacts{font-size:clamp(22px,4vmin,40px);font-weight:800}
.tside{flex:1;display:flex;flex-direction:column;gap:3vmin;min-height:0}
.tseason{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vmin;padding:2vmin;min-height:0}
.tseason .scene{width:auto;height:100%;max-width:100%;min-height:0;flex:1 1 0}
.tsname{font-size:clamp(24px,4.4vmin,44px);font-weight:900;color:var(--muted)}
.tdate{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:1.6vmin;text-align:center;font-weight:900;font-size:clamp(22px,4vmin,40px)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:1vw;background:var(--road);border-radius:18px;padding:.6vw 1vw .6vw;flex:none}
.sd{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-weight:900;font-size:min(1.8vw,20px);padding:4px;border-radius:12px}
.sd.cur{background:rgba(255,255,255,.2)}
.sd .w{min-height:1.3em}
@media (orientation:portrait){.today{flex-direction:column}}

/* ---------- stickers ---------- */
.stk-scroll{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 8px 32px;margin:0 -8px}
.stk-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--gap);margin:auto 0}
@media (orientation:portrait){.stk-grid{grid-template-columns:repeat(5,1fr)}}
.stk{display:grid;place-items:center;font-size:clamp(36px,7vmin,70px);aspect-ratio:1;border-radius:22px}
.stk.locked{background:rgba(255,255,255,.4);color:rgba(255,255,255,.9);font-weight:900;border:3px dashed rgba(255,255,255,.8)}

/* ---------- celebrate ---------- */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(20,40,80,.35);display:grid;place-items:center;animation:fade .3s}
.cel{padding:4vmin 7vmin;display:flex;flex-direction:column;align-items:center;gap:1.5vmin;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.cel:active{transform:none;box-shadow:var(--shadow)}
.cel-t{font-size:clamp(48px,10vmin,110px);font-weight:900;color:#FF6B3D}
.cel-st{font-size:clamp(90px,22vmin,220px);line-height:1;animation:spinin 1s cubic-bezier(.3,1.6,.5,1)}
@keyframes spinin{from{transform:scale(0) rotate(-200deg)}}
.cel-sub{font-weight:900;font-size:clamp(20px,3.4vmin,34px);color:var(--muted)}
.cel-up{font-weight:900;font-size:clamp(18px,3vmin,30px);color:#1559B8;background:#E8F3FF;border-radius:14px;padding:.35em .9em}
.cel-btns{display:flex;gap:4vmin;margin-top:1vmin}

/* ---------- parent ---------- */
.pscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding:4px 2px 24px;touch-action:pan-y;width:100%;max-width:820px;margin:0 auto}
.pcard{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.pcard h3{margin:0 0 8px;font-size:22px}
.pcard p{margin:6px 0;font-size:17px;line-height:1.45;color:var(--muted)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid #EEF2F7}
.pcard h3+.prow{border-top:0}
.ptext{flex:1;font-size:18px;font-weight:700}
.prow.has .ptext::before{content:'✅ '}
.pbtn{width:52px;height:52px;border-radius:14px;background:#F1F5FA;font-size:24px;display:grid;place-items:center;flex:none}
.pbtn:active{background:#E1E8F2}
.prow.recording{background:#FFECEC;border-radius:12px}
.prow.recording .rec{animation:pulse .8s infinite}
.prow:not(.has) [data-act=del]{visibility:hidden}
.hchip{width:52px;height:52px;border-radius:14px;background:#F1F5FA;font-size:24px;display:grid;place-items:center;flex:none;opacity:.45}
.hchip.on{opacity:1;background:#FFF1C2;box-shadow:inset 0 0 0 3px var(--gold)}
.switch{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin-top:8px}
.switch input{width:26px;height:26px}
.pacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.pact{background:#E8F3FF;color:#1559B8;border-radius:14px;padding:12px 18px;font-weight:800;font-size:17px}
.pact:active{background:#D3E7FF}
.pfile{position:absolute;width:0;height:0;opacity:0}
.danger{background:#FFE5E5;color:#C62828;border-radius:14px;padding:12px 18px;font-weight:800;font-size:17px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;animation:fade .2s}

/* ---------- animations ---------- */
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-16%)}55%{transform:translateY(0)}75%{transform:translateY(-5%)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.04)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
@keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.9)}50%{box-shadow:0 0 0 10px rgba(255,201,60,0)}}
@keyframes drivein{from{transform:translateX(-40%);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.15)}}

let ctx = null, master = null;

// trim silence around a recording, normalise volume, soften the edges
function polish(buf) {
  const c = audioCtx(), ch = buf.getChannelData(0), n = ch.length;
  let peak = 0;
  for (let i = 0; i < n; i++) { const v = Math.abs(ch[i]); if (v > peak) peak = v; }
  if (peak < .01) return buf;
  const th = Math.max(.015, peak * .07);
  let s = 0, e = n - 1;
  while (s < n && Math.abs(ch[s]) < th) s++;
  while (e > s && Math.abs(ch[e]) < th) e--;

  s = Math.max(0, s - pad);
  e = Math.min(n, e + pad * 3);
  const len = e - s, gain = Math.min(5, .9 / peak), fade = Math.min(Math.floor(buf.sampleRate * .01), len >> 2);
  const out = c.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
  for (let k = 0; k < buf.numberOfChannels; k++) {
    const src = buf.getChannelData(k), dst = out.getChannelData(k);
    for (let i = 0; i < len; i++) {

      dst[i] = src[s + i] * gain * env;

}

function segments(items, merge) {

    const q = raw.endsWith('?'), key = q ? raw.slice(0, -1) : raw;
    const text = (PHRASES[key] || key) + (q ? '?' : '');
    if (recordedKeys.has(key)) { segs.push({ key, idx }); return; }
    const last = segs[segs.length - 1];

      else last.text += (/[.!?…]$/.test(last.text) ? ' ' : '. ') + text;

async function say(items, opts = {}) {

const Rec = {
  stream: null, mr: null, chunks: [],
  async start() {
    if (!this.stream) this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    this.chunks = [];
    this.mr = new MediaRecorder(this.stream, type ? { mimeType: type } : undefined);
    this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.start();
  },
  stop() {
    return new Promise(res => {
      const mr = this.mr;
      if (!mr || mr.state === 'inactive') return res(null);
      mr.onstop = () => res(new Blob(this.chunks, { type: mr.mimeType || 'audio/mp4' }));
      mr.stop();
    });
  },
  release() {
    if (this.mr && this.mr.state !== 'inactive') try { this.mr.stop(); } catch (e) {}
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null; this.mr = null;

function wavBytes(buf) {
  const k = Math.max(1, Math.floor(buf.sampleRate / 22050)), src = buf.getChannelData(0);
  const n = Math.floor(src.length / k), sr = Math.round(buf.sampleRate / k);
  const v = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = 0; j < k; j++) s += src[i * k + j];
    v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s / k)) * 32767, true);

}

    if (!recordedKeys.has(k)) continue;
    const buf = await loadClip(k);
    if (!buf) continue;
    clips[k] = toB64(wavBytes(buf));
    times[k] = ((await DB.get(k)) || {}).t || Date.now();
  }

}
async function readVoiceFile(file) {
  const j = JSON.parse(await file.text());
  if (!j || j.app !== 'kalendarik' || !j.clips) throw new Error('not a voice file');
  const out = [];
  for (const [k, b] of Object.entries(j.clips)) {
    if (!(k in PHRASES)) continue;
    const data = fromB64(b).buffer;
    await decode(data.slice(0));
    out.push([k, { data, type: j.type || 'audio/wav', t: (j.times && j.times[k]) || Date.now(), src: 'file' }]);

}

async function loadBundledVoice() {

    const res = await fetch(VOICE_FILE, { cache: 'no-cache' });

    for (const [k, v] of await readVoiceFile(await res.blob())) {
      const cur = await DB.get(k);
      if (cur && (cur.src !== 'file' || cur.t >= v.t)) continue;
      await DB.put(k, v);

      clipCache.delete(k);

/* ================= confetti ================= */
const confetti = (() => {
  const cv = $('#fx'), cx = cv.getContext('2d');
  let parts = [], raf = null;
  const resize = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; };
  addEventListener('resize', resize); resize();
  const colors = DAYS.map(d => d.color);
  function tick() {
    cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a);
      cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      cx.restore();
    }
    parts = parts.filter(p => p.y < innerHeight + 40);
    raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, innerWidth, innerHeight), null);
  }
  return {
    burst(n = 140, x = innerWidth / 2, y = innerHeight * .35) {
      const spread = n > 60 ? innerWidth * .6 : 40;
      for (let i = 0; i < n; i++) parts.push({
        x: x + (Math.random() - .5) * spread, y, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
        r: 6 + Math.random() * 8, c: colors[rnd(colors.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3,
      });
      if (!raf) raf = requestAnimationFrame(tick);
    },
  };
})();

}
const carSVG = (color, n) => `<svg class="carsvg" viewBox="0 -2 120 66">${carInner(color, n)}</svg>`;
const ghostCar = () => `<svg class="carsvg" viewBox="0 -2 120 66"><path d="${CAR_BODY}" fill="rgba(255,255,255,.55)" stroke="#C3CDDC" stroke-width="2.5" stroke-dasharray="6 5"/>`
  + [30, 94].map(x => `<circle cx="${x}" cy="52" r="10" fill="rgba(255,255,255,.35)" stroke="#C3CDDC" stroke-width="2.5" stroke-dasharray="5 4"/>`).join('')

// hint stages: 0 colour + number, 1 colour + name caption below, 2 colour only, 3 grey (only the spoken name tells which day it is)
const dayCar = (d, h = 0) => h > 2 ? carSVG('#B4BFCF', '?') : carSVG(d.color, h ? '' : d.n);
const dayCap = (d, h, hid) => h === 1 ? `<div class="cap${hid ? ' hid' : ''}" style="--c:${d.color}">${rootName(d)}</div>` : '';
function brickSVG(color) {
  const f = color || 'rgba(255,255,255,.5)', st = color ? shade(color, -.28) : 'rgba(255,255,255,.95)';
  const r = (x, y, w, h, rx) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${st}" stroke-width="2"/>`;
  return `<svg viewBox="0 0 48 34" class="brick${color ? ' on' : ''}">${r(8, 2, 11, 8, 2)}${r(29, 2, 11, 8, 2)}${r(2, 8, 44, 24, 4)}</svg>`;
}

function wheelSVG({ filled = [0, 1, 2, 3], next = -1, sel = -1, car = false, carDeg = 0, tappable = false } = {}) {
  const R = 82, pt = (a, r) => [(r * Math.sin(a)).toFixed(2), (-r * Math.cos(a)).toFixed(2)];
  let s = `<svg viewBox="-104 -104 208 208" class="wheel"><circle r="101" fill="#4A5468"/><circle r="92" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="7 7" opacity=".8"/>`;
  SEASONS.forEach((se, i) => {
    const a1 = (i * 90 - 45) * Math.PI / 180, a2 = (i * 90 + 45) * Math.PI / 180, on = filled.includes(i);
    const cls = 'sector' + (i === next ? ' next' : '') + (i === sel ? ' sel' : '');
    s += `<path class="${cls}" ${tappable ? `data-act="sector" data-quiet data-i="${i}"` : ''} d="M0 0 L${pt(a1, R).join(' ')} A${R} ${R} 0 0 1 ${pt(a2, R).join(' ')} Z" fill="${on ? se.color : '#E9EEF5'}" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>`;
    const [x, y] = pt(i * Math.PI / 2, 47);
    if (on) s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="38">${se.emoji}</text>`;
    else if (i === next) s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="40" font-weight="900" fill="#9AA9BF">?</text>`;
  });
  s += `<circle r="15" fill="#fff"/>`;
  if (car) s += `<g class="ringcar" style="transform:rotate(${carDeg}deg)"><g transform="translate(-16 -103) scale(.27)">${carInner('#FF5A36', '★')}</g></g>`;
  return s + '</svg>';
}

function sceneSVG(id) {

  const rain = (x, y) => [0, 8, 16, 24].map((dx, i) => `<path d="M${x + dx} ${y + (i % 2) * 5} l-3 8" stroke="#4E9BE0" stroke-width="2.4" stroke-linecap="round"/>`).join('');
  const sun = (x, y, r) => `<g stroke="#FFC21A" stroke-width="3" stroke-linecap="round">${[...Array(8)].map((_, i) => { const a = i * Math.PI / 4; return `<line x1="${x + Math.cos(a) * (r + 4)}" y1="${y + Math.sin(a) * (r + 4)}" x2="${x + Math.cos(a) * (r + 10)}" y2="${y + Math.sin(a) * (r + 10)}"/>`; }).join('')}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#FFD43B"/>`;
  const mountains = (c, snow) => `<path d="M-10 96 L42 44 L78 80 L118 34 L168 88 L212 62 L212 130 L-10 130 Z" fill="${c}"/>`
    + (snow ? `<path d="M118 34 L104 50 L111 47 L118 53 L124 46 L131 49 Z M42 44 L32 54 L38 52 L44 57 L48 51 L52 54 Z" fill="#fff"/>` : '');
  const hill = c => `<path d="M-5 102 Q55 84 115 98 T205 94 L205 135 L-5 135 Z" fill="${c}"/>`;

    + dots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.4" fill="${dc}"/>`).join('');
  const DOTS = [[40, 50], [54, 46], [47, 60], [36, 66], [60, 62], [47, 38], [30, 60], [64, 56], [52, 70]];
  switch (id) {
    case 'winter': return `<svg viewBox="0 0 200 130">${sky('#93AAC4', '#E2EAF2')}${mountains('#7D90A8', true)}${cloud(140, 18, '#C9D3DF', 1.1)}${cloud(166, 28, '#B5C1CF')}${rain(144, 34)}${rain(170, 42)}${hill('#86BC7E')}${trunk}<path d="M47 74 L47 44 M47 60 L34 48 M47 54 L60 42 M34 48 L29 40 M60 42 L66 35 M47 64 L58 56 M47 48 L42 40" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round" fill="none"/>${em('⛄', 108, 58, 20)}${em('🍊', 158, 110, 24)}${em('☂️', 90, 108, 24)}</svg>`;
    case 'spring': return `<svg viewBox="0 0 200 130">${sky('#79CCFF', '#E0F6FF')}${sun(166, 24, 11)}${mountains('#89B89A')}${hill('#6CC95A')}${crown('#8BDB6A', DOTS, '#FF8FC0')}${em('🌷', 90, 110, 22)}${em('🌼', 124, 114, 18)}${em('🌷', 160, 106, 22)}${em('🦋', 140, 58, 22)}${em('🐝', 98, 70, 16)}</svg>`;
    case 'summer': return `<svg viewBox="0 0 200 130">${sky('#36B4F4', '#BFEBFF')}${sun(162, 26, 15)}<rect x="0" y="76" width="200" height="40" fill="#1E96DC"/><path d="M10 88 q6 -4 12 0 t12 0 M70 96 q6 -4 12 0 t12 0 M120 86 q6 -4 12 0 t12 0" stroke="#8ED6FF" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M-5 106 Q60 94 120 104 T205 100 L205 135 L-5 135 Z" fill="#F5D48A"/>${em('🌴', 38, 74, 52)}${em('⛱️', 112, 102, 28)}${em('🍉', 160, 116, 18)}${em('⛵', 166, 84, 16)}</svg>`;
    default: return `<svg viewBox="0 0 200 130">${sky('#FFB46E', '#FFEBD3')}${cloud(128, 20, '#fff')}${rain(132, 36)}${mountains('#B98962')}${hill('#D7A65A')}${crown('#F28C28', DOTS, '#E2502C')}${em('🍂', 84, 44, 18)}${em('🍁', 100, 76, 16)}${em('🍂', 18, 84, 16)}${em('🍇', 152, 110, 26)}${em('🍄', 120, 114, 18)}</svg>`;

const rootName = d => d.root ? `<b>${d.name.slice(0, d.root)}</b>${d.name.slice(d.root)}` : d.name;

function bar({ title = '', back = 'home', right = '' } = {}) {

}
const btn = (act, ic) => `<button class="toy round" data-act="${act}">${ic}</button>`;
function anim(el, cls) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });

function toast(msg) {

function holdToOpen(el, fn, ms = 1500) {

  const end = () => { clearTimeout(t); el.classList.remove('holding'); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('holding'); t = setTimeout(() => { end(); fn(); }, ms); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, end));
}
function celebrate(onAgain, up) {

    <div class="cel-btns"><button class="toy round xl" data-a="again">🔁</button><button class="toy round xl" data-a="home">🏠</button></div></div>`;

/* ================= learning logic ================= */
function pick(mode, items, avoid) {
  const pool = items.filter(i => i !== avoid);
  const w = pool.map(i => { const s = S.stats[mode + ':' + i.id] || [0, 0]; return (s[1] + 1) / (s[0] + 1) + .3; });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
const withDistractors = (t, items, n) => shuffle([t, ...shuffle(items.filter(i => i !== t)).slice(0, n - 1)]);
const record = (mode, item, ok) => { const s = S.stats[mode + ':' + item.id] || (S.stats[mode + ':' + item.id] = [0, 0]); s[ok ? 0 : 1]++; };
const bubble = word => `<button class="bubble" data-act="repeat">🔊<span>Где <b>${word.toLowerCase()}</b>?</span></button>`;
const row7 = (days, gi, h) => `<div class="row7" style="--k:${days.length}">${days.map((d, i) => `<div class="r7${i === gi ? ' gh' : ''}" data-d="${DAYS.indexOf(d)}">${i === gi ? ghostCar() + dayCap(d, h, true) : dayCar(d, h) + dayCap(d, h)}</div>`).join('')}</div>`;
// once the answer is found every car on the stage shows its colour and number
const reveal = stage => $$('[data-d]', stage).forEach(c => {
  const d = DAYS[+c.dataset.d], cap = $('.cap', c);
  $('.carsvg', c).outerHTML = carSVG(d.color, d.n);
  if (cap) cap.classList.remove('hid');
});
function tmrStage(base, dir, h) {
  const cell = k => {
    const i = (base + k + 7) % 7;
    if (k === 0) return `<div class="tm"><span class="pin">📍</span><div data-d="${i}">${dayCar(DAYS[i], h)}${dayCap(DAYS[i], h)}</div></div>`;
    return k === dir ? `<div class="tm ask" data-d="${i}">${ghostCar()}</div>` : `<div class="tm faded">${ghostCar()}</div>`;
  };
  return `<div class="tmr"><div class="tmcells">${cell(-1)}${cell(0)}${cell(1)}</div><div class="tmlabels"><span>⬅ вчера</span><span>сегодня</span><span>завтра ➡</span></div></div>`;
}

const QUIZ = {
  'seasons-find': {
    max: 4, maxw: '300px', menu: () => go(SeasonsMenu), opt: sceneOpt,
    make(L, prev) { const t = pick('seasons-find', SEASONS, prev); return { answer: t, options: withDistractors(t, SEASONS, L), prompt: ['p_where', `w_${t.id}?`], stage: bubble(t.name) }; },
  },
  'days-find': {
    max: 4, maxw: '260px', hints: true, menu: () => go(DaysMenu), opt: carOpt,
    make(L, prev, h) {
      const t = pick('days-find', DAYS, prev);
      // grey cars: the whole week stands on the road, the day is found by its place
      return { answer: t, options: h > 2 ? DAYS : withDistractors(t, DAYS, L), look: h, prompt: ['p_where', `w_${t.id}?`], stage: bubble(t.name) };
    },
  },
  'days-missing': {
    fixed: 3, maxw: '240px', hints: true, menu: () => go(DaysMenu), opt: carOpt,
    make(L, prev, h) {
      const t = pick('days-missing', DAYS, prev), q = { answer: t, options: withDistractors(t, DAYS, 3), look: Math.min(h, 2) };
      if (h < 3) return { ...q, prompt: ['p_missing'], stage: row7(DAYS, DAYS.indexOf(t), h) };
      // grey cars starting from any day: the gap is found only by listening to the names
      const g = 1 + rnd(3), win = [0, 1, 2, 3, 4].map(i => DAYS[(DAYS.indexOf(t) - g + i + 7) % 7]);
      return { ...q, stage: row7(win, g, h), speak: stage => listenWeek(win, g, stage) };
    },
    onRight(q, stage) { $('.r7.gh', stage).className = 'r7 filled'; reveal(stage); },
  },
  'days-tomorrow': {
    fixed: 3, maxw: '240px', hints: true, menu: () => go(DaysMenu), opt: carOpt,
    make(L, prev, h) {
      // alternate: завтра, вчера, завтра, ...
      const dir = this.dir = this.dir === 1 ? -1 : 1;
      const t = pick('days-tomorrow', DAYS, prev), base = (DAYS.indexOf(t) - dir + 7) % 7;
      return {
        answer: t, options: shuffle([t, DAYS[base], DAYS[(base - dir + 7) % 7]]), look: Math.min(h, 2),
        prompt: ['p_today', 'w_' + DAYS[base].id, dir > 0 ? 'p_tomorrow' : 'p_yesterday'], stage: tmrStage(base, dir, h),
      };
    },
    onRight(q, stage) { $('.tm.ask', stage).className = 'tm filled'; reveal(stage); },
  },
};
// reads the cars one by one, keeps silent on the empty one, then asks who is missing
async function listenWeek(win, g, stage) {
  const cells = $$('.r7', stage), keys = [...win.map(d => 'w_' + d.id), 'p_missing'];
  const read = from => say(keys.slice(from, from === 0 ? g : keys.length), { merge: false, gap: 250, onItem: i => anim(cells[from + i], 'bounce') });
  if (!await read(0)) return;
  const tok = sayToken;
  anim(cells[g], 'bounce');
  await wait(1000);
  if (tok === sayToken) read(g + 1);
}
const level = mode => QUIZ[mode].fixed || S.levels[mode] || 2;
function adjustLevel(mode, misses) {
  const M = QUIZ[mode];
  if (M.fixed) return;
  let L = level(mode), st = S.streaks[mode] || 0;
  if (misses === 0 && ++st >= 3 && L < M.max) { L++; st = 0; }
  if (misses >= 2) { L = Math.max(2, L - 1); st = 0; }
  S.levels[mode] = L; S.streaks[mode] = st;
}
// day games: a round with at most one mistake takes the next hint away, a hard round gives one back
const hintOf = mode => S.hints[mode] || 0;
function adjustHints(mode, wrong) {
  const h = hintOf(mode), nh = wrong <= 1 ? Math.min(3, h + 1) : wrong >= 5 ? Math.max(0, h - 1) : h;
  S.hints[mode] = nh;
  return nh > h ? nh : 0;
}

function SeasonsLearn() {
  const now = seasonIdx();
  let sel = now, deg = now * 90;
  app.innerHTML = `<div class="screen">${bar({ title: 'Времена года', back: 'back', right: btn('next', '▶️') })}
    <div class="slearn"><div class="wheelbox">${wheelSVG({ sel, car: true, carDeg: deg, tappable: true })}</div><button class="toy scard" data-act="scene" data-quiet></button></div></div>`;

    <div class="week"><div class="zone school"></div><div class="zone home"></div><div class="road"></div>
    ${DAYS.map((d, i) => `<div class="daycol" data-act="day" data-quiet data-i="${i}" style="--c:${d.color};--col:${i + 1}">
      <span class="dflag">${i === now ? '📍' : ''}</span><span class="dacts">${d.home ? '🏠' : '🎒'}${d.ball ? '⚽' : ''}</span>
      <span class="dcar">${carSVG(d.color, d.n)}</span><span class="dname">${rootName(d)}</span><span class="ddots">${'<i></i>'.repeat(d.n)}</span></div>`).join('')}
    <div class="zlabel school">🎒 садик</div><div class="zlabel home">🏠 выходные</div></div></div>`;
  const cars = $$('.dcar', app);
  bind({
    back: () => go(DaysMenu),
    day: el => { const i = +el.dataset.i; anim(cars[i], 'bounce'); sfx.vroom(); say('d_' + DAYS[i].id); },
    parade: () => say(DAYS.map(d => 'w_' + d.id), { merge: false, gap: 180, onItem: i => anim(cars[i], 'bounce') }),
  });
  say(['p_today', 'w_' + DAYS[now].id]);
}

function Quiz(mode) {
  const M = QUIZ[mode], h = M.hints ? hintOf(mode) : 0;
  let alive = true, done = 0, q = null, misses = 0, wrong = 0, busy = false, prev = null;
  app.innerHTML = `<div class="screen"><div class="bar">${btn('back', '⬅️')}<div class="bricks">${BRICKS.map(() => brickSVG()).join('')}</div>${btn('repeat', '🔊')}</div>
    <div class="stage"></div><div class="options"></div></div>`;
  const stage = $('.stage', app), opts = $('.options', app);
  const ask = () => q.speak ? q.speak(stage) : say(q.prompt);
  function next() {
    misses = 0; busy = false;
    q = M.make(level(mode), prev, h);
    prev = q.answer;
    stage.innerHTML = q.stage;
    opts.style.setProperty('--n', q.options.length);
    opts.style.setProperty('--maxw', M.maxw);
    opts.classList.toggle('week', q.options.length === 7);
    opts.innerHTML = q.options.map((o, i) => `<button class="toy opt" data-act="opt" data-quiet data-i="${i}" style="animation:pop .4s ${i * .08}s both">${M.opt(o, q.look)}</button>`).join('');
    setTimeout(() => $$('.opt', opts).forEach(b => { b.style.animation = ''; }), 800);
    ask();
  }
  async function answer(el) {
    if (busy) return;
    const o = q.options[+el.dataset.i], box = $('.carbox', el);
    if (q.look && box) box.innerHTML = carSVG(o.color, o.n); // a tapped car shows who it is
    if (o !== q.answer) {
      misses++; wrong++;
      sfx.bad();
      anim(el, 'wiggle');
      setTimeout(() => el.classList.add('off'), 500);
      say(['w_' + o.id, 'r_try']);
      if (misses >= 2) $$('.opt', opts)[q.options.indexOf(q.answer)].classList.add('hint');
      return;
    }
    busy = true;
    el.classList.remove('hint');
    el.classList.add('right');
    $$('.opt', opts).forEach(b => b !== el && b.classList.add('off'));
    sfx.good();
    const r = el.getBoundingClientRect();
    confetti.burst(40, r.left + r.width / 2, r.top + r.height / 2);
    record(mode, q.answer, misses === 0);
    adjustLevel(mode, misses);
    S.stars++;
    save();
    $$('.brick', app)[done].outerHTML = brickSVG(BRICKS[done]);
    done++;
    if (M.onRight) M.onRight(q, stage);
    await say([praise(), 'w_' + o.id]);
    if (!alive) return;
    await wait(300);
    if (!alive) return;
    if (done >= BRICKS.length) celebrate(() => go(Quiz, mode), M.hints && adjustHints(mode, wrong)); else next();
  }
  bind({ back: () => M.menu(), repeat: ask, opt: answer });
  next();
  return () => { alive = false; };
}

function DaysOrder() {
  const h = hintOf('days-order');
  if (h > 2) return DaysPlace();
  let alive = true, pos = 0, misses = 0, wrong = 0, busy = false;
  app.innerHTML = `<div class="screen">${bar({ title: 'По порядку', back: 'back', right: btn('repeat', '🔊') })}
    <div class="ord">
      <div class="ord-road"><div class="fin">🏁</div><div class="slots">${DAYS.map((_, i) => `<div class="slot${i ? '' : ' next'}"></div>`).join('')}</div></div>
      <div class="snames">${DAYS.map(() => '<div class="sname"></div>').join('')}</div>
      <div class="pool">${shuffle(DAYS).map(d => `<button class="toy opt" data-act="car" data-quiet data-id="${d.id}">${carOpt(d, h)}</button>`).join('')}</div>
    </div></div>`;
  const slots = $$('.slot', app), names = $$('.sname', app);
  bind({
    back: () => go(DaysMenu),
    repeat: () => say(pos ? ['p_next'] : ['p_order_days']),
    car: async el => {
      if (busy) return;
      const d = DAYS.find(x => x.id === el.dataset.id);
      if (d.n - 1 !== pos) {
        misses++; wrong++;
        sfx.bad();
        anim(el, 'wiggle');
        say(['w_' + d.id, 'r_try']);
        if (misses >= 2) $(`.pool [data-id="${DAYS[pos].id}"]`, app).classList.add('hint');
        return;
      }
      sfx.vroom();
      el.classList.add('gone');
      slots[pos].className = 'slot full';
      slots[pos].innerHTML = carSVG(d.color, d.n);
      names[pos].textContent = d.name;
      pos++; misses = 0;
      if (pos < 7) { slots[pos].classList.add('next'); say('w_' + d.id); return; }
      busy = true;
      await say('w_' + d.id);
      if (!alive) return;
      await wait(300);
      await say(DAYS.map(x => 'w_' + x.id), { merge: false, gap: 200, onItem: i => anim(slots[i], 'bounce') });
      if (!alive) return;
      S.stars += 3;
      celebrate(() => go(DaysOrder), adjustHints('days-order', wrong));
    },
  });
  say('p_order_days');
  return () => { alive = false; };
}

// grey stage of «По порядку»: the days come in random order, the child finds each one's place on the road
function DaysPlace() {
  let alive = true, misses = 0, wrong = 0, busy = false;
  const queue = shuffle(DAYS);
  app.innerHTML = `<div class="screen">${bar({ title: 'По порядку', back: 'back', right: btn('repeat', '🔊') })}
    <div class="ord">
      <div class="ord-road"><div class="fin">🏁</div><div class="slots">${DAYS.map((_, i) => `<div class="slot" data-act="slot" data-quiet data-i="${i}">${ghostCar()}</div>`).join('')}</div></div>
      <div class="snames">${DAYS.map(() => '<div class="sname"></div>').join('')}</div>
      <div class="ordq"></div>
    </div></div>`;
  const slots = $$('.slot', app), names = $$('.sname', app), qbox = $('.ordq', app);
  const ask = () => say(['p_where', `w_${queue[0].id}?`]);
  function next() {
    misses = 0; busy = false;
    qbox.innerHTML = bubble(queue[0].name);
    anim(qbox, 'pop');
    ask();
  }
  bind({
    back: () => go(DaysMenu),
    repeat: () => { if (queue.length) ask(); },
    slot: async el => {
      if (busy || el.classList.contains('full')) return;
      const i = +el.dataset.i, d = queue[0];
      if (DAYS[i] !== d) {
        misses++; wrong++;
        sfx.bad();
        anim(el, 'wiggle');
        say(['w_' + DAYS[i].id, 'r_try']);
        if (misses >= 2) slots[d.n - 1].classList.add('hint');
        return;
      }
      busy = true;
      sfx.vroom();
      el.className = 'slot full';
      el.innerHTML = carSVG(d.color, d.n);
      names[i].textContent = d.name;
      queue.shift();
      await say('w_' + d.id);
      if (!alive) return;
      if (queue.length) { next(); return; }
      qbox.innerHTML = '';
      await wait(300);
      await say(DAYS.map(x => 'w_' + x.id), { merge: false, gap: 200, onItem: k => anim(slots[k], 'bounce') });
      if (!alive) return;
      S.stars += 3;
      celebrate(() => go(DaysOrder), adjustHints('days-order', wrong));
    },
  });
  next();
  return () => { alive = false; };
}

function SeasonsOrder() {
  let alive = true, misses = 0, busy = false;
  const start = rnd(4), filled = [start];
  let pos = (start + 1) % 4, deg = start * 90;
  app.innerHTML = `<div class="screen">${bar({ title: 'Собери круг', back: 'back', right: btn('repeat', '🔊') })}
    <div class="sord"><div class="wheelbox"></div><div class="spool">${shuffle(SEASONS.filter((_, i) => i !== start)).map(s => `<button class="toy opt" data-act="pick" data-quiet data-i="${SEASONS.indexOf(s)}"><div class="scene">${sceneSVG(s.id)}</div></button>`).join('')}</div></div></div>`;
  const box = $('.wheelbox', app);
  function draw(to, sel = -1) {
    const from = deg;
    deg = to;
    box.innerHTML = wheelSVG({ filled, next: filled.length < 4 ? pos : -1, sel, car: true, carDeg: from });
    if (to !== from) requestAnimationFrame(() => requestAnimationFrame(() => { $('.ringcar', box).style.transform = `rotate(${to}deg)`; }));
  }
  draw(deg);
  bind({
    back: () => go(SeasonsMenu),
    repeat: () => say(['w_' + SEASONS[(pos + 3) % 4].id, 'p_next']),
    pick: async el => {
      if (busy) return;
      const i = +el.dataset.i;
      if (i !== pos) {
        misses++;
        sfx.bad();
        anim(el, 'wiggle');
        say(['w_' + SEASONS[i].id, 'r_try']);
        if (misses >= 2) $(`.spool [data-i="${pos}"]`, app).classList.add('hint');
        return;
      }
      sfx.vroom();
      el.classList.add('gone');
      filled.push(i);
      misses = 0;
      pos = (pos + 1) % 4;
      draw(deg + 90);
      if (filled.length < 4) { say('w_' + SEASONS[i].id); return; }
      busy = true;
      await say('w_' + SEASONS[i].id);
      // victory lap: the car drives the whole year once more
      for (let k = 0; k < 4 && alive; k++) {
        await wait(250);
        const idx = (deg / 90 + 1) % 4;
        draw(deg + 90, idx);
        await say('w_' + SEASONS[idx].id);
      }
      if (!alive) return;
      await wait(400);
      S.stars += 3;
      celebrate(() => go(SeasonsOrder));
    },
  });
  say(['p_order_seasons', 'w_' + SEASONS[start].id, 'p_next']);
  return () => { alive = false; };
}

  const di = todayIdx(), d = DAYS[di], se = SEASONS[seasonIdx()];
  const date = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const tag = i => i === di ? 'сегодня' : i === (di + 6) % 7 ? 'вчера' : i === (di + 1) % 7 ? 'завтра' : '';
  app.innerHTML = `<div class="screen">${bar({ title: 'Сегодня', right: btn('repeat', '🔊') })}
    <div class="today">
      <button class="toy tmain" data-act="day" data-quiet style="--c:${d.color}">
        <div class="tlabel">Сегодня</div><div class="tcarbig">${carSVG(d.color, d.n)}</div>
        <div class="dpill big" style="--c:${d.color};--t:${d.ink}">${d.name}</div>
        <div class="tacts">${d.home ? '🏠 выходной' : '🎒 садик'}${d.ball ? ' · ⚽ футбол' : ''}</div>
      </button>
      <div class="tside">
        <button class="toy tseason" data-act="season" data-quiet><div class="scene">${sceneSVG(se.id)}</div>
          <div class="tsname">Сейчас <span class="dpill" style="--c:${se.color};--t:${se.ink}">${se.name.toLowerCase()}</span></div></button>
        <div class="tdate">📅 ${date}</div>
      </div>
    </div>
    <div class="strip">${DAYS.map((x, i) => `<button class="sd${i === di ? ' cur' : ''}" data-act="sd" data-quiet data-i="${i}"><span class="w">${tag(i)}</span>${carSVG(x.color, x.n)}</button>`).join('')}</div>
  </div>`;

    sd: el => { anim(el, 'bounce'); say('w_' + DAYS[+el.dataset.i].id); },
  });
  intro();

function Stickers() {
  app.innerHTML = `<div class="screen">${bar({ title: 'Мои наклейки', right: `<div class="pill">⭐ ${S.stars}</div>` })}
    <div class="stk-scroll"><div class="stk-grid">${STICKERS.map((e, i) => i < S.stickers ? `<button class="toy stk" data-act="stk" data-quiet>${e}</button>` : '<div class="stk locked">?</div>').join('')}</div></div></div>`;
  bind({ back: () => go(Home), stk: el => { sfx.star(); anim(el, 'bounce'); } });
  say('t_stickers');
}

const HINT_GAMES = [['days-find', '🔍 Найди'], ['days-order', '🏁 По порядку'], ['days-missing', '❓ Кто пропал?'], ['days-tomorrow', '📅 Вчера и завтра']];
function Parent() {
  let recKey = null, autoStop = null, resetArmed = false;
  const keys = Object.keys(PHRASES);
  app.innerHTML = `<div class="screen">${bar({ title: 'Для родителей' })}
    <div class="pscroll">
      <section class="pcard"><h3>🎙️ Ваш голос</h3>
        <p>Нажмите 🔴, скажите фразу, нажмите ⏹ — запись сразу проиграется. Ребёнок будет слышать вас вместо синтезатора. Говорите чётко и радостно.</p>
        <p><b>Записано: <span class="pcount"></span> из ${keys.length}</b></p>
        <label class="switch"><input type="checkbox" class="ptts"${S.tts ? ' checked' : ''}> Синтезатор для фраз без записи</label>
      </section>
      <section class="pcard"><h3>🚗 Подсказки в днях недели</h3>
        <p>🔢 цифры → 🏷️ подписи с названием дня → 🎨 только цвета → ⚪ серые машинки: день узнаётся только по названию. Раунд почти без ошибок убирает следующую подсказку, трудный раунд возвращает её. Можно переключить и вручную.</p>
        ${HINT_GAMES.map(([m, t]) => `<div class="prow"><div class="ptext">${t}</div>${['🔢', '🏷️', '🎨', '⚪'].map((ic, k) => `<button class="hchip${hintOf(m) === k ? ' on' : ''}" data-act="hint" data-quiet data-m="${m}" data-h="${k}">${ic}</button>`).join('')}</div>`).join('')}
      </section>
      <section class="pcard"><h3>💾 Перенос записей</h3>
        <p>Сохраните записи в файл, чтобы не потерять их или перенести на другое устройство (например, AirDrop с компьютера на iPad). На iPad: «Календарик» с экрана Домой → ⚙️ → «Загрузить из файла».</p>
        <p>Если iPad открывает приложение с ноутбука, положите файл <b>${VOICE_FILE}</b> в папку приложения — iPad подхватит голос сам.</p>
        <div class="pacts"><button class="pact" data-act="export" data-quiet>💾 Сохранить в файл</button><button class="pact" data-act="import" data-quiet>📂 Загрузить из файла</button></div>
        <input type="file" class="pfile" accept=".json,application/json">
      </section>
      ${PHRASE_GROUPS.map(([g, list]) => `<section class="pcard"><h3>${g}</h3>${list.map(([k, t]) => `<div class="prow${recordedKeys.has(k) ? ' has' : ''}" data-key="${k}">
        <div class="ptext">${t}</div><button class="pbtn" data-act="play" data-quiet>▶️</button><button class="pbtn rec" data-act="rec" data-quiet>🔴</button><button class="pbtn" data-act="del" data-quiet>🗑️</button></div>`).join('')}</section>`).join('')}
      <section class="pcard"><h3>📲 Установка на iPad</h3>
        <p>Откройте страницу в Safari → «Поделиться» → «На экран Домой». Дальше приложение работает без интернета.</p>
        <p><b>Важно:</b> записи хранятся внутри установленного приложения. Записывайте голос, открыв «Календарик» с экрана Домой, а не во вкладке Safari.</p>
        <p>Прогресс: ⭐ ${S.stars}, наклеек ${S.stickers} из ${STICKERS.length}.</p>
        <button class="danger" data-act="reset">Сбросить звёзды и наклейки</button>
      </section>
    </div></div>`;
  const count = () => { $('.pcount', app).textContent = keys.filter(k => recordedKeys.has(k)).length; };
  const rowOf = key => $(`.prow[data-key="${key}"]`, app);
  async function stopRec() {
    clearTimeout(autoStop);
    const key = recKey, row = rowOf(key);
    recKey = null;
    row.classList.remove('recording');
    $('.rec', row).textContent = '🔴';
    const blob = await Rec.stop();
    if (!blob || blob.size < 800) { toast('Не получилось записать, попробуйте ещё раз'); return; }
    const data = await blob.arrayBuffer();
    try { await decode(data.slice(0)); } catch (e) { toast('Запись не читается, попробуйте ещё раз'); return; }
    await DB.put(key, { data, type: blob.type, t: Date.now() });
    clipCache.delete(key);
    recordedKeys.add(key);
    row.classList.add('has');
    count();
    say(key);
  }
  bind({
    back: () => go(Home),
    play: el => say(el.closest('.prow').dataset.key),
    rec: async el => {
      const key = el.closest('.prow').dataset.key;
      if (recKey) { const same = recKey === key; await stopRec(); if (same) return; }
      hush();
      try { setAudioSession('play-and-record'); await Rec.start(); }
      catch (e) { toast('Нет доступа к микрофону'); return; }
      recKey = key;
      el.closest('.prow').classList.add('recording');
      el.textContent = '⏹';
      autoStop = setTimeout(stopRec, 12000);
    },
    del: async el => {
      const row = el.closest('.prow'), key = row.dataset.key;
      await DB.del(key);
      clipCache.delete(key);
      recordedKeys.delete(key);
      row.classList.remove('has');
      count();
    },
    export: async () => {
      if (!recordedKeys.size) { toast('Пока нет записей'); return; }
      const j = await voiceFile(), n = Object.keys(j.clips).length;
      const file = new File([JSON.stringify(j)], VOICE_FILE, { type: 'application/json' });
      // iPad: share sheet (AirDrop, Files); computer: regular download
      if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch (e) { return; }
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(file);
        a.download = VOICE_FILE;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      }
      toast(`Сохранено записей: ${n}`);
    },
    import: () => $('.pfile', app).click(),
    hint: el => {
      S.hints[el.dataset.m] = +el.dataset.h;
      save();
      $$(`.hchip[data-m="${el.dataset.m}"]`, app).forEach(b => b.classList.toggle('on', b === el));
    },
    reset: el => {
      if (!resetArmed) { resetArmed = true; el.textContent = 'Точно? Нажмите ещё раз'; return; }
      Object.assign(S, { stars: 0, stickers: 0, stats: {}, levels: {}, streaks: {}, hints: {} });
      save();
      el.textContent = 'Готово ✓';
    },
  });
  $('.ptts', app).addEventListener('change', e => { S.tts = e.target.checked; save(); });
  $('.pfile', app).addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const clips = await readVoiceFile(f);
      for (const [k, v] of clips) {
        await DB.put(k, v);
        clipCache.delete(k);
        recordedKeys.add(k);
        rowOf(k).classList.add('has');
      }
      count();
      toast(`Загружено записей: ${clips.length}`);
    } catch (err) { toast('Это не файл с записями «Календарика»'); }
  });
  count();
  return () => { clearTimeout(autoStop); Rec.release(); setAudioSession('playback'); };
}

/* ================= boot ================= */
document.addEventListener('pointerdown', () => { if (ctx && ctx.state !== 'running') ctx.resume(); }, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) hush(); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
DB.open().then(preloadClips).then(loadBundledVoice).catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
go(Start);
